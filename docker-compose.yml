services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${BACKEND_PORT:-8084}"
      - --reload
    ports:
      - "${BACKEND_PORT:-8084}:${BACKEND_PORT:-8084}"
    volumes:
      # Docker creates ./data on first run if it does not exist yet.
      - ./data:/app/data
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8084}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:20-alpine
    # Create repo-root .env from backend/.env.example before first compose run.
    command:
      - sh
      - -c
      - echo "frontend placeholder" && tail -f /dev/null
    ports:
      - "5173:5173"
    restart: "no"
