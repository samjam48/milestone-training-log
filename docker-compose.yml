services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${BACKEND_PORT:-8084}"
      - --reload
    ports:
      - "${BACKEND_PORT:-8084}:${BACKEND_PORT:-8084}"
    volumes:
      # Docker creates ./data on first run if it does not exist yet.
      - ./data:/app/data
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8084}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8084}
      BACKEND_HOST: backend
      FRONTEND_PORT: ${FRONTEND_PORT:-5151}
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port $${FRONTEND_PORT:-5151}
    ports:
      - "${FRONTEND_PORT:-5151}:${FRONTEND_PORT:-5151}"
    depends_on:
      backend:
        condition: service_healthy
