name: Postgres migrations

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  alembic-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pytest
          POSTGRES_DB: milestone_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milestone_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:pytest@localhost:5432/milestone_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (dev)
        run: python -m pip install -e './backend[dev]'
      - name: Run Postgres migration tests
        working-directory: backend
        run: python -m pytest app/tests/test_postgres_migrations.py -v --no-cov -m postgres
