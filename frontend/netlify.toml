# Netlify site config (base directory: frontend/)
# API proxy target: milestone-training-log.onrender.com (O11.1 complete).

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://milestone-training-log.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
