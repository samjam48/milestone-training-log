# Netlify site config (base directory: frontend/)
# O11.1: replace REPLACE_ME with your Render service hostname after first backend deploy.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://REPLACE_ME.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
